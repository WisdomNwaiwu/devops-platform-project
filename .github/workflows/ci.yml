name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-scan:
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t devops-platform-project:ci .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: devops-platform-project:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Smoke test with Compose
        run: |
          cp .env.example .env
          docker compose up -d --build
          for i in $(seq 1 20); do
            curl -sf localhost:8080/health && break
            sleep 2
          done
          curl -sf localhost:8080/users
          docker compose down -v

  push-image:
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/wisdomnwaiwu/devops-platform-project:latest
            ghcr.io/wisdomnwaiwu/devops-platform-project:${{ github.sha }}